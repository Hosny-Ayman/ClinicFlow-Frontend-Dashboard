<form [formGroup]="workingHoursForm" (ngSubmit)="onSubmit()" class="max-w-4xl mx-auto w-full mt-12 mb-12 px-4">
    <div dir="rtl" class="bg-white shadow-[0_8px_30px_rgb(0,0,0,0.06)] border border-gray-100 rounded-4xl p-8 md:p-12 text-right">
        <div class="mb-10 text-right">
            <h2 class="text-xl md:text-2xl font-bold text-[#183153] mb-4">أيام العمل</h2>

            <div class="flex flex-wrap gap-3">
                @for(day of daysList; track day.day; let i = $index) {
                <div
                    (click)="toggleDay(i)"
                    class="px-6 py-3 rounded-xl font-bold text-lg cursor-pointer transition-all duration-200 select-none border-2"
                    [ngClass]="{
                        'bg-[#00a67e] text-white border-[#00a67e] shadow-md': day.isSelected,
                        'bg-white text-[#183153] border-[#00a67e] hover:bg-gray-50': !day.isSelected
                    }"
                >
                    {{ day.label }}
                </div>
                }
            </div>
        </div>

        <div class="mb-10 text-right">
            <h2 class="text-xl md:text-2xl font-bold text-[#183153] mb-4">وقت العمل</h2>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="flex flex-col text-right w-full">
                    <label class="block mb-2 font-medium text-gray-500 text-sm">من</label>
                    <div class="relative w-full">
                        <p-datepicker
                            formControlName="openTime"
                            [timeOnly]="true"
                            hourFormat="12"
                            placeholder="09:00 AM"
                            class="w-full"
                            inputStyleClass="w-full rounded-2xl px-4 py-4 text-lg border outline-none transition-all bg-white text-right focus:border-[#00a67e] border-[#d9e1ec]"
                        >
                        </p-datepicker>
                        <i class="pi pi-clock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-xl pointer-events-none"></i>
                    </div>
                </div>

                <div class="flex flex-col text-right w-full">
                    <label class="block mb-2 font-medium text-gray-500 text-sm">إلى</label>
                    <div class="relative w-full">
                        <p-datepicker
                            formControlName="closeTime"
                            [timeOnly]="true"
                            hourFormat="12"
                            placeholder="05:00 PM"
                            styleClass="w-full"
                            inputStyleClass="w-full rounded-2xl px-4 py-4 text-lg border outline-none transition-all bg-white text-right focus:border-[#00a67e] border-[#d9e1ec]"
                        >
                        </p-datepicker>
                        <i class="pi pi-clock absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-xl pointer-events-none"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="mb-10 text-right border-b border-gray-100 pb-10">
            <h2 class="text-xl md:text-2xl font-bold text-[#183153] mb-4">مدة الحجز لكل موعد</h2>
            <div class="w-full md:w-1/2 relative">
                <p-select
                    [options]="durations"
                    formControlName="appointmentDurationInMinutes"
                    placeholder="اختر مدة الحجز"
                    class="w-full rounded-2xl h-14 text-lg border-[#d9e1ec] focus:border-[#00a67e] shadow-none flex items-center bg-white"
                    [style]="{'width': '100%'}"
                >
                </p-select>
            </div>
        </div>

        <div class="flex flex-col sm:flex-row justify-center sm:justify-between items-center gap-6 w-full">
            <button
                type="button"
                class="cursor-pointer w-full sm:w-auto flex items-center justify-center gap-3 bg-white hover:bg-gray-50 border border-[#d9e1ec] rounded-2xl px-8 py-4 text-lg font-bold text-gray-500 transition-all duration-200 order-2 sm:order-1"
            >
                <i class="pi pi-arrow-right text-sm"></i> رجوع
            </button>

            <button
                type="submit"
                class="cursor-pointer w-full sm:w-auto flex items-center justify-center gap-3 bg-[#00a67e] hover:bg-[#008f6b] border-none rounded-2xl px-8 py-4 text-lg font-bold text-white shadow-lg hover:shadow-xl transition-all duration-200 order-1 sm:order-2"
            >
                {{ isEditMode ? 'حفظ التعديلات' : 'إنهاء الإعداد' }}
                <i class="pi text-sm" [class.pi-pencil]="isEditMode" [class.pi-check]="!isEditMode"></i>
            </button>
        </div>
    </div>
</form>
