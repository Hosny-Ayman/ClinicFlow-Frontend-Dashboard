<div class="flex flex-col items-center justify-center w-full h-full min-h-100 text-center p-8" dir="rtl">
    <div class="w-28 h-28 rounded-full border-[5px] border-[#00a67e] flex items-center justify-center mb-8 bg-white shadow-sm">
        <i class="pi pi-check text-6xl text-[#00a67e] font-extrabold"></i>
    </div>

    <h2 class="text-3xl md:text-4xl font-extrabold text-[#183153] mb-4">تم إعداد عيادتك بنجاح 🎉</h2>
    <p class="text-gray-500 font-medium text-lg md:text-xl mb-12 max-w-md">يمكنك الآن البدء في استخدام ClinicFlow وإدارة عيادتك بكفاءة</p>

    <button
        type="button"
        (click)="goToDashboard.emit()"
        class="cursor-pointer flex items-center justify-center gap-3 bg-[#00a67e] hover:bg-[#008f6b] border-none rounded-xl px-12 py-4 text-lg font-bold text-white shadow-lg hover:shadow-xl transition-all duration-200"
    >
        الذهاب إلى Dashboard
        <i class="pi pi-arrow-left text-sm mt-1"></i>
    </button>
</div>
